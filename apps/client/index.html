<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Arena</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="scoreboard" hidden></div>
    <div id="killfeed"></div>
    <div id="round" hidden></div>
    <div id="hud" hidden>
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="timer">3:00</div>
      <button id="mute" title="Sound an/aus">🔊</button>
    </div>
    <div id="dead" hidden>Respawn …</div>
    <div id="join">
      <h1>NEON ARENA</h1>
      <input id="nickname" maxlength="16" placeholder="Nickname" autocomplete="off" />
      <button id="play">Spielen</button>
      <p id="join-error"></p>
      <button id="reload" hidden>Neu laden</button>
      <a id="toplink" href="/leaderboard.html" target="_blank">🏆 Bestenliste</a>
    </div>
    <div id="debug" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
