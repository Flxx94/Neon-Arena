services:
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
    ports:
      - "5173:80"
    environment:
      VITE_SERVER_URL: http://localhost:2567
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - "2567:2567"
    env_file:
      - ../.env
    environment:
      PORT: 2567
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://neon:neon@postgres:5432/neon_arena
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    command: sh -c "cd apps/server && ./node_modules/.bin/prisma migrate deploy && node dist/index.js"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon
      POSTGRES_DB: neon_arena
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
