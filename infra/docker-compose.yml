services:
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
    ports:
      - "5173:5173"
    environment:
      VITE_SERVER_URL: http://localhost:2567
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - "2567:2567"
    env_file:
      - ../.env
    environment:
      PORT: 2567
      CLIENT_URL: http://localhost:5173
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon
      POSTGRES_DB: neon_arena
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
