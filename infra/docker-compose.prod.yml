# Neon Arena – lokaler Prod-Stack (M5-04, local-only, kein Cloud-Deploy)
services:
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:2567}
    ports:
      - "5173:80"
    environment:
      VITE_SERVER_URL: http://localhost:2567
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - "2567:2567"
    env_file:
      - ../.env
    environment:
      PORT: 2567
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
      DATABASE_URL: postgresql://neon:neon@postgres:5432/neon_arena
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: sh -c "cd apps/server && ./node_modules/.bin/prisma migrate deploy && node dist/index.js"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon
      POSTGRES_DB: neon_arena
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
